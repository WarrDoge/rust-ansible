# Ansible configuration for WASI/WASIX environment
# This configuration forces the wasi_local connection plugin which
# executes modules in-process instead of via subprocess.

[defaults]
# Use the wasi_local connection plugin for all localhost connections
transport = wasi_local

# Disable host key checking (localhost only)
host_key_checking = False

# Disable retry files
retry_files_enabled = False

# Set default inventory to localhost
inventory = localhost,

# Disable gathering facts by default (many facts require subprocess)
gathering = explicit

# Disable cowsay
nocows = True

# Reduce verbosity of deprecation warnings
deprecation_warnings = False

[connection]
# Force local connection type
pipelining = True

[privilege_escalation]
# Disable become - not supported in WASI
become = False
